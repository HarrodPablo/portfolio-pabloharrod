<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Brand fire gradient -->
    <linearGradient id="ph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="ph-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.35" />
    </linearGradient>

    <!-- Ambient center glow -->
    <radialGradient id="ph-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Squircle dark background matching #0a0a0a -->
  <rect width="100" height="100" rx="24" fill="#0a0a0a" />
  
  <!-- Subtle ambient glow in center -->
  <rect width="100" height="100" rx="24" fill="url(#ph-glow)" />

  <!-- Premium glowing border -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#ph-border)" stroke-width="3" />

  <!-- Centered Monogram PH -->
  <text 
    x="50" 
    y="51" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="44" 
    font-weight="900" 
    fill="url(#ph-grad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-1.5"
  >
    PH
  </text>
</svg>
